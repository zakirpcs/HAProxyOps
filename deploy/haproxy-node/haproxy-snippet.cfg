# Add to /etc/haproxy/haproxy.cfg on every managed node, then:
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy
#
# The Runtime API socket is what the Data Plane API drives. Keep it on a unix
# socket - dataplaneapi runs on the same host, so there is no reason to expose
# the socket over TCP.

global
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    # Only required if dataplaneapi.yml uses reload_strategy: custom (it
    # drives the reload itself over this socket). Not needed for
    # reload_strategy: systemd, which just shells out to systemctl instead -
    # that is the default in dataplaneapi.yml in this directory.
    master-worker

# Credentials the Data Plane API authenticates the dashboard against. Each
# node should get its own password - HAProxyOps stores one per node (Fernet-
# encrypted in its own database), so there is no shared/global credential to
# keep in sync across the fleet, just this file and that one node's entry in
# HAProxyOps agreeing with each other.
#
# Use a crypt(3) hash, not insecure-password (plaintext on disk):
#   openssl passwd -6 'YourRealPasswordHere'
# then paste the $6$... output below. HTTP Basic Auth still sends the
# plaintext password on every request either way - hashing only protects
# what sits in this file, so enter that same plaintext password (not the
# hash) as the node's password in HAProxyOps.
userlist dataplaneapi
    user haproxyops password $6$CHANGE-ME-run-openssl-passwd--6-above

# Optional: HAProxy's own stats page, for a human checking this node
# directly. Not required for Prometheus metrics in HAProxyOps - see below.
frontend stats
    # Bind to the management interface only, never 0.0.0.0 on a public box.
    # Pick a dedicated port - never reuse a port a production frontend already
    # binds on this same IP, or haproxy will refuse to (re)start.
    bind 10.0.0.10:8404 ssl crt /etc/haproxy/certs/node.pem
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:CHANGE-ME
    # Restrict to the dashboard host and your monitoring subnet.
    http-request deny unless { src 10.0.0.20 } || { src 10.0.0.0/24 }

# Prometheus metrics: nothing else needed here. HAProxyOps has its own
# built-in exporter (backend/app/prom_export.py, served at
# /api/prometheus/nodes) that replays the state it already polls from every
# registered node over the Data Plane API - point your Prometheus at that
# one endpoint instead of at each node. This works on any HAProxy version,
# including anything older than 2.0 (which predates HAProxy's own native
# `prometheus-exporter` service and cannot run it at all - see "Metrics and
# history" in the README for the version check and why this exists). No
# `http-request use-service prometheus-exporter` line, no exporter sidecar,
# and no extra firewall rule needed on this node for metrics specifically.

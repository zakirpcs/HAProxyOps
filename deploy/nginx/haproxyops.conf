# /etc/nginx/conf.d/haproxyops.conf  -- TLS edge on the dashboard host.
#
# The SSE endpoint carries the JWT in the query string (EventSource cannot set
# headers), so the access log format below drops the query string.
log_format haproxyops_access '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name haproxyops.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name haproxyops.example.com;

    ssl_certificate     /etc/pki/tls/certs/haproxyops.crt;
    ssl_certificate_key /etc/pki/tls/private/haproxyops.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/haproxyops.access.log haproxyops_access;

    # Content-Security-Policy. The app loads nothing from anywhere else: one
    # module script, one stylesheet, both same-origin, and XHR/SSE only to its own
    # /api. So everything is locked to 'self'.
    #
    # style-src carries 'unsafe-inline' and cannot yet drop it: the UI sets inline
    # style attributes from JavaScript (chart series colours, the modal's width
    # variable), and CSP treats a style attribute as inline style. Removing it
    # means moving those few values into CSS custom properties set by class.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}

name: CI

on:
  push:
  pull_request:

jobs:
  # Deliberately first and separate: it takes a second, and a source file that
  # has stopped being plain text makes every later grep-based check unreliable
  # without saying so.
  text-files:
    name: Source files are plain text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-text-files.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # Also type-checks the tests, so one that has drifted from the code it
      # covers fails here rather than rotting quietly.
      - run: npm run build

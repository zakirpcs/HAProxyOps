# Demo Prometheus. Scrapes the built-in exporter each HAProxy node serves on
# its stats port - no exporter sidecar is involved (HAProxy 2.0+).
#
# In production you almost certainly already run Prometheus; point HAProxyOps
# at it with HAPROXYOPS_PROMETHEUS_URL instead of running this one.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: [haproxy-demo:8404]
        labels: {node: lb-edge-1}
      - targets: [haproxy-demo-2:8404]
        labels: {node: lb-edge-2}
      - targets: [haproxy-demo-3:8404]
        labels: {node: lb-internal-1}
      - targets: [haproxy-demo-4:8404]
        labels: {node: lb-internal-2}

  # Real nodes, scraped through HAProxyOps' own built-in exporter
  # (backend/app/prom_export.py) rather than the node directly - it replays
  # the snapshot HAProxyOps already polled over the Data Plane API, so
  # nothing needs to be installed or exposed on the node itself. One target
  # (the API container) serves every registered node; each node's series
  # carry their own `instance` label, so honor_labels is required or
  # Prometheus would overwrite it with this scrape target's address instead.
  - job_name: haproxyops-nodes
    honor_labels: true
    metrics_path: /api/prometheus/nodes
    static_configs:
      - targets: [api:8000]

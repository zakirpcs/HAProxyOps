# Second demo node shape: an internal load balancer with more proxies and a
# backend that is entirely down, so the fleet table has a genuinely unhealthy
# row to sort and filter on.
global
    log stdout format raw local0
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

program api
    command /usr/local/bin/dataplaneapi-start.sh
    no option start-on-reload

userlist dataplane-users
    user haproxyops insecure-password demo-password

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats

frontend internal-web
    bind *:8081
    default_backend app-back

frontend internal-api
    bind *:8082
    default_backend api-back

frontend legacy
    bind *:8083
    default_backend legacy-back

backend app-back
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check
    server web2 web2:80 check

backend api-back
    balance leastconn
    option httpchk GET /
    server api1 web1:80 check
    server api2 web2:80 check
    server api3 127.0.0.1:9998 check

# Entirely down: gives the fleet view a hard failure to surface.
backend legacy-back
    option httpchk GET /
    server legacy1 127.0.0.1:9996 check
    server legacy2 127.0.0.1:9997 check

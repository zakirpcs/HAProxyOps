# Demo HAProxy node for the local stack.
#
# Exposes both the HTTP stats page and the Data Plane API, so it can be
# registered with either driver. seed.sh registers it as `dataplane`.
#
# It also runs the Data Plane API as an HAProxy `program`, which is what gives
# the dashboard its runtime actions (ready / drain / maint / weight).
# See demo/dataplaneapi-start.sh for the flags that matter.
global
    log stdout format raw local0
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

program api
    command /usr/local/bin/dataplaneapi-start.sh
    no option start-on-reload

# Credentials the Data Plane API authenticates against. Demo only - a real
# node uses a hashed password (see deploy/haproxy-node/dataplaneapi.yml).
userlist dataplane-users
    user haproxyops insecure-password demo-password

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

frontend http-in
    bind *:8081
    default_backend app-back

frontend api-in
    bind *:8082
    acl is_health path_beg /health
    use_backend health-back if is_health
    # Dynamic backend selection: the name is computed per request. The Data
    # Plane API reports the rule, but its target is an expression rather than
    # any backend that exists, so a naive reading calls it a missing backend.
    use_backend %[req.hdr(x-tenant),lower] if { req.hdr(x-tenant) -m found }
    default_backend app-back

backend app-back
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check weight 100
    server web2 web2:80 check weight 100
    # Points at a dead port on purpose: HAProxy resolves server names at
    # startup and refuses to boot on an unknown host, so an absent container
    # is not usable as a "down server" demo.
    server web3 127.0.0.1:9999 check weight 50 backup

backend health-back
    option httpchk GET /
    server web1 web1:80 check

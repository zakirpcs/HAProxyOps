# Included inside the default server block of the UBI nginx image
# (/opt/app-root/etc/nginx.default.d/*.conf). Location blocks only - the
# server block, listen port and document root come from the image's own
# nginx.conf, which already serves /opt/app-root/src on :8080.

# Content-Security-Policy. The app loads nothing from anywhere else: one
# module script, one stylesheet, both same-origin, and XHR/SSE only to its own
# /api. So everything is locked to 'self'.
#
# style-src carries 'unsafe-inline' and cannot yet drop it: the UI sets inline
# style attributes from JavaScript (chart series colours, the modal's width
# variable), and CSP treats a style attribute as inline style. Removing it
# means moving those few values into CSS custom properties set by class.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# SPA routes are client-side; anything not on disk falls back to index.html.
location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://haproxyops-api:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SSE needs buffering off and no read timeout, or the stream dies at 60s.
location /api/events {
    proxy_pass http://haproxyops-api:8000;
    proxy_set_header Host       $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
}
